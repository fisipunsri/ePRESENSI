<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ePRESENSI FISIP UNSRI</title>
<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#060B16;overflow:hidden;}
  #loader{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#060B16;color:#93A1C2;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;text-align:center;padding:24px;transition:opacity .3s;}
  #loader .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(224,177,92,.25);border-top-color:#E0B15C;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader.hide{opacity:0;pointer-events:none;}
  #fallbackBtn{display:none;margin-top:4px;background:#1B2A4D;border:1px solid rgba(255,255,255,.08);color:#EEF2FA;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#060B16;}
</style>
</head>
<body>
  <div id="loader">
    <div class="spin"></div>
    <div>Memuat ePRESENSI…</div>
    <button id="fallbackBtn" onclick="window.location.href=APP_URL">Buka Langsung di Tab Ini</button>
  </div>
  <iframe id="appFrame" title="ePRESENSI FISIP UNSRI"
    allow="camera; geolocation" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
    // Ganti dengan URL deployment Web App Apps Script Anda (Deploy → Manage deployments → Web app URL).
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyhOePKVeflViF02vYSD7SeI2QDcn9S3jrtr3Npep1zv-0xujq-zYQXZOXb_OMAHgM-/exec';

    const frame = document.getElementById('appFrame');
    const loader = document.getElementById('loader');
    const fallbackBtn = document.getElementById('fallbackBtn');
    let loaded = false;

    frame.addEventListener('load', () => { loaded = true; loader.classList.add('hide'); });

    // Setelah login Google, ePRESENSI membalikkan browser ke halaman ini
    // membawa token sesi di hash URL (#epresensi_token=...) — bukan token
    // baru, tinggal dimasukkan lagi ke iframe supaya langsung masuk tanpa
    // nyangkut di tampilan/URL bawaan script.google.com.
    let src = APP_URL;
    const m = location.hash.match(/epresensi_token=([^&]+)/);
    if (m) {
      src += (APP_URL.indexOf('?') > -1 ? '&' : '?') + 'token=' + m[1];
      history.replaceState(null, '', location.pathname + location.search);
    }
    frame.src = src;

    // Jaga-jaga: iframe Apps Script kadang lambat/gagal termuat di sebagian
    // browser. Kalau setelah 8 detik belum termuat, tampilkan tombol buka langsung.
    setTimeout(() => { if (!loaded) fallbackBtn.style.display = 'inline-block'; }, 8000);
  </script>
</body>
</html>
