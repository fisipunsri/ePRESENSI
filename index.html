<style>
  :root{ color-scheme: dark; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#060B16;overflow:hidden;font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#060B16;}
  #loader{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#060B16;color:#93A1C2;text-align:center;padding:24px;}
  .spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#E0B15C;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .hide{display:none !important;}
  #fallbackBtn{margin-top:6px;display:none;background:#1B2A4D;border:1px solid rgba(255,255,255,.08);color:#EEF2FA;padding:10px 16px;border-radius:11px;font-size:13px;font-weight:600;cursor:pointer;}

  /* ---------- Layar login (sama dengan login di Apps Script) ---------- */
  #loginScreen{position:fixed;inset:0;z-index:2;overflow-y:auto;background:#EAF4FE;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  #loginScreen h3, #loginScreen p{margin:0;}
  #loginScreen button{font-family:inherit;cursor:pointer;}
  .ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.14em;}
  .wordmark{display:flex;flex-direction:column;align-items:center;color:#fff;line-height:1;}
  .wordmark b{font-family:'Sora',sans-serif;font-weight:800;font-size:24px;letter-spacing:.02em;}
  .wordmark span{font-family:'Sora',sans-serif;font-weight:700;font-size:10px;letter-spacing:.46em;padding-left:.46em;margin-top:5px;}
  .wordmark.lg b{font-size:clamp(34px,10.5vw,46px);letter-spacing:.01em;}
  .wordmark.lg span{font-size:clamp(11px,3.4vw,15px);letter-spacing:.5em;padding-left:.5em;margin-top:9px;}
  .auth-screen{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:#EAF4FE;}
  .login-hero{
    position:relative;overflow:hidden;text-align:center;color:#fff;
    padding:calc(46px + env(safe-area-inset-top,0px)) 24px 0;
    background:linear-gradient(180deg,#0A52B8 0%,#0F6AD2 52%,#1E88EA 100%);
    border-radius:0 0 50% 50% / 0 0 44px 44px;
  }
  .login-hero::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(circle at 12% 15%, rgba(255,255,255,.30) 0 4px, rgba(255,255,255,.08) 5px 8px, transparent 9px),
      radial-gradient(circle at 86% 11%, rgba(255,255,255,.26) 0 3px, rgba(255,255,255,.07) 4px 7px, transparent 8px),
      radial-gradient(circle at 30% 40%, rgba(255,255,255,.22) 0 2px, transparent 3px),
      radial-gradient(circle at 74% 34%, rgba(255,255,255,.28) 0 5px, rgba(255,255,255,.08) 6px 10px, transparent 11px),
      radial-gradient(circle at 7% 58%, rgba(255,255,255,.24) 0 3px, rgba(255,255,255,.07) 4px 7px, transparent 8px),
      radial-gradient(circle at 93% 55%, rgba(255,255,255,.22) 0 3px, transparent 4px),
      radial-gradient(circle at 54% 9%, rgba(255,255,255,.22) 0 2px, transparent 3px),
      radial-gradient(circle at 42% 66%, rgba(255,255,255,.20) 0 4px, rgba(255,255,255,.06) 5px 8px, transparent 9px),
      radial-gradient(circle at 19% 86%, rgba(255,255,255,.22) 0 3px, transparent 4px),
      radial-gradient(circle at 81% 80%, rgba(255,255,255,.24) 0 4px, rgba(255,255,255,.07) 5px 8px, transparent 9px);
  }
  .login-hero > *{position:relative;}
  .login-greet{font-family:'Sora',sans-serif;font-weight:600;font-size:20px;margin-top:22px !important;}
  .login-sub{font-size:13px;color:rgba(255,255,255,.84);margin-top:5px !important;}
  .login-illus{display:block;width:100%;max-width:340px;height:auto;margin:8px auto 0;}
  .login-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:26px;padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));}
  .menu-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;}
  .menu-head h3{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:#0B5CB8;letter-spacing:-.01em;}
  .info-btn{background:none;border:0;color:#0B5CB8;font-size:20px;display:flex;padding:2px;}
  .menu-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .menu-item{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:9px;color:#0B5CB8;font-size:13px;font-weight:500;}
  .bubble{
    width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:28px;color:#0A63CC;
    background:radial-gradient(circle at 32% 26%, #fff 0%, #D8E9FB 60%, #B9D6F7 100%);

  }
  .bubble .ico{stroke-width:1.7;}
  .btn-google{
    width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
    background:linear-gradient(180deg,#2390EE,#0C65CC);color:#fff;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;
    box-shadow:0 12px 22px -10px rgba(10,99,204,.75), inset 0 -3px 0 rgba(0,0,0,.14);
    transition:transform .1s;
  }
  .btn-google:active{transform:scale(.98);}
  .g-chip{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .g-chip svg{width:16px;height:16px;}
  .login-note{text-align:center;font-size:12px;color:#5F7C9F;margin-top:12px !important;}
  .err{color:#E04B55;font-size:13px;text-align:center;margin-bottom:12px;}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;width:calc(100% - 32px);max-width:440px;background:#fff;color:#0E2A52;border:1px solid rgba(26,118,210,.3);border-radius:13px;padding:12px 14px;font-size:13px;box-shadow:0 14px 30px -16px rgba(10,70,150,.35);font-family:'Inter',system-ui,sans-serif;}

  /* ---------- Layar kamera (jembatan untuk halaman Apps Script) ---------- */
  #camOverlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;}
  #camV{flex:1;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000;}
  #camBar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:22px 0 calc(26px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(0,0,0,.55),transparent);}
  #camShutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.55);box-shadow:0 6px 20px rgba(0,0,0,.4);padding:0;cursor:pointer;}
  #camShutter:active{transform:scale(.92);}
  #camClose{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;}

<script>
  // Ganti 2 nilai ini:
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxKeCrDkzn958wxDH9CsIpijhFZ6KJJZZnoqsYgxhXDXuwvCg9ODsZIB5_5hbmSK3Oe-Q/exec';
  const WORKER_LOGIN_URL = 'https://epresensi-login.kepegawaiantendikfisip.workers.dev/login';
  const SESSION_KEY = 'epresensi_session';
  const SESSION_JAM = 12;

  document.getElementById('btnLogin').href = WORKER_LOGIN_URL;

  let toastTimer;
  function menuInfo() {
    const t = document.getElementById('toast');
    t.textContent = 'Masuk dengan Google terlebih dahulu untuk membuka menu ini.';
    t.classList.remove('hide');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hide'), 3200);
  }

  function showLogin(errMsg) {
    document.getElementById('loginScreen').classList.remove('hide');
    document.getElementById('loader').classList.add('hide');
    document.getElementById('appFrame').classList.add('hide');
    const box = document.getElementById('errBox');
    if (errMsg) { box.textContent = errMsg; box.classList.remove('hide'); } else { box.classList.add('hide'); }
  }

  function showApp(token) {
    document.getElementById('loginScreen').classList.add('hide');
    document.getElementById('loader').classList.remove('hide');
    const frame = document.getElementById('appFrame');
    let loaded = false;
    frame.addEventListener('load', () => { loaded = true; document.getElementById('loader').classList.add('hide'); frame.classList.remove('hide'); });
    frame.src = APP_URL + (APP_URL.indexOf('?') > -1 ? '&' : '?') + 'token=' + encodeURIComponent(token);
    setTimeout(() => { if (!loaded) document.getElementById('fallbackBtn').style.display = 'inline-block'; }, 8000);
  }

  function saveSession(token) {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ token: token, exp: Date.now() + SESSION_JAM * 3600 * 1000 }));
  }
  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s.token || Date.now() > s.exp) { localStorage.removeItem(SESSION_KEY); return null; }
      return s.token;
    } catch (e) { return null; }
  }

  // 1) Baru saja dibalikkan dari Worker setelah login Google?
  const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  const tokenFromHash = hashParams.get('epresensi_token');
  const errFromHash = hashParams.get('epresensi_error');
  if (tokenFromHash || errFromHash) history.replaceState(null, '', location.pathname + location.search);

  if (tokenFromHash) {
    saveSession(tokenFromHash);
    showApp(tokenFromHash);
  } else if (errFromHash) {
    showLogin(errFromHash);
  } else if (new URLSearchParams(location.search).get('login') === '1') {
    // Dari tombol "Masuk dengan Google" di dalam aplikasi: buang sesi lama, langsung ke Google.
    localStorage.removeItem(SESSION_KEY);
    window.location.replace(WORKER_LOGIN_URL);
  } else {
    const existing = loadSession();
    if (existing) showApp(existing);
    else showLogin();
  }
</script>

<script>
  // ===== Jembatan kamera =====
  // Halaman Apps Script berjalan di iframe sandbox yang memblokir getUserMedia. Karena itu kamera dibuka
  // di halaman ini (level atas), lalu foto dikirim balik lewat postMessage. Tidak ada pilihan galeri.
  (function () {
    const overlay = document.getElementById('camOverlay'), vid = document.getElementById('camV');
    let stream = null, replyTo = null, reqId = 0;

    // Pastikan pengirim pesan memang iframe aplikasi (atau turunannya).
    function fromApp(src) {
      try {
        const root = document.getElementById('appFrame').contentWindow;
        for (let w = src, i = 0; w && i < 8; i++) {
          if (w === root) return true;
          if (w.parent === w) break;
          w = w.parent;
        }
      } catch (e) {}
      return false;
    }
    function send(act, extra) {
      if (!replyTo || !reqId) return;
      try { replyTo.postMessage(Object.assign({ epresensi: 'cam', act: act, id: reqId }, extra || {}), '*'); } catch (e) {}
    }
    function stopStream() {
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      vid.srcObject = null;
      overlay.classList.add('hide');
    }
    async function openCam(src, id) {
      stopStream();
      replyTo = src; reqId = id;
      send('ack');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return send('error', { name: 'TidakDidukung' });
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
        if (reqId !== id) { s.getTracks().forEach(t => t.stop()); return; }
        stream = s; vid.srcObject = s;
        overlay.classList.remove('hide');
        try { await vid.play(); } catch (e) {}
      } catch (e) {
        if (reqId === id) send('error', { name: e && e.name, message: e && e.message });
      }
    }
    function snap() {
      const w = vid.videoWidth, h = vid.videoHeight;
      if (!w || !h) return;
      const k = Math.min(1, 1024 / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      const ctx = c.getContext('2d');
      ctx.translate(c.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(vid, 0, 0, c.width, c.height);
      send('photo', { dataUrl: c.toDataURL('image/jpeg', 0.85) });
      stopStream();
    }
    document.getElementById('camShutter').addEventListener('click', snap);
    document.getElementById('camClose').addEventListener('click', () => { send('cancel'); stopStream(); });
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || d.epresensi !== 'cam' || !fromApp(ev.source)) return;
      if (d.act === 'open') openCam(ev.source, d.id);
      else if (d.act === 'close') { reqId = 0; stopStream(); }
    });
  })();
</script>

<script>
  // ===== Jembatan info perangkat =====
  // Dipanggil halaman Apps Script lewat postMessage untuk mendapat merek/model HP.
  (function () {
    function fromApp(src) {
      try {
        const root = document.getElementById('appFrame').contentWindow;
        for (let w = src, i = 0; w && i < 8; i++) {
          if (w === root) return true;
          if (w.parent === w) break;
          w = w.parent;
        }
      } catch (e) {}
      return false;
    }
    let cache = null;
    function infoPerangkat() {
      if (cache) return cache;
      const ua = navigator.userAgent || '';
      const m = /Android [\d.]+; ([^;)]+)/.exec(ua);
      let model = m ? m[1].replace(/ Build\/.*$/, '').trim() : '';
      const reduksi = model === 'K'; // userAgent Chrome yang disamarkan
      if (reduksi) model = '';
      const a = /Android ([\d.]+)/.exec(ua);
      let os = (a && !reduksi) ? 'Android ' + a[1].split('.')[0] : (/iPhone|iPad/.test(ua) ? 'iOS' : '');
      const gabung = function () { return [model, os].filter(Boolean).join(' | ').slice(0, 120); };
      const uad = navigator.userAgentData;
      if (!uad || !uad.getHighEntropyValues) { cache = Promise.resolve(gabung()); return cache; }
      const batas = new Promise(function (r) { setTimeout(function () { r(gabung()); }, 1500); });
      const tanya = uad.getHighEntropyValues(['model', 'platformVersion']).then(function (v) {
        const mdl = String(v.model || '').trim();
        if (mdl) model = mdl;
        const pv = String(v.platformVersion || '').split('.')[0];
        if (pv && /android/i.test(String(v.platform || uad.platform || ''))) os = 'Android ' + pv;
        return gabung();
      }).catch(function () { return gabung(); });
      cache = Promise.race([tanya, batas]);
      return cache;
    }
    window.addEventListener('message', function (ev) {
      const d = ev.data;
      if (!d || d.epresensi !== 'info' || d.act !== 'get' || !fromApp(ev.source)) return;
      infoPerangkat().then(function (info) {
        try { ev.source.postMessage({ epresensi: 'info', act: 'result', id: d.id, info: info }, '*'); } catch (e) {}
      });
    });
  })();
</script>
